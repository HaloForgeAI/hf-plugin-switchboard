name: Plugin CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - name: macOS x64
            os: macos-13
            target: x86_64-apple-darwin
            artifact: macos-x64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test backend
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Check plugin manifest
        run: npx --yes @haloforge/plugin-pack@0.2.2 check .

      - name: Package target
        run: npx --yes @haloforge/plugin-pack@0.2.2 pack . --release --target ${{ matrix.target }} --out dist/plugin-${{ matrix.artifact }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchboard-${{ matrix.artifact }}
          path: |
            dist/plugin-${{ matrix.artifact }}/*.hfpkg
            dist/plugin-${{ matrix.artifact }}/*.hfpkg.sha256
