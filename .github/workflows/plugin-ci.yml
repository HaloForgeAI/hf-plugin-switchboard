name: Plugin CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test backend
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Check plugin manifest
        run: npx --yes @haloforge/plugin-pack@0.2.11 check .

      - name: Package Windows target
        run: npx --yes @haloforge/plugin-pack@0.2.11 pack . --release --target x86_64-pc-windows-msvc --out dist/plugin-windows-x64

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchboard-windows-x64
          path: |
            dist/plugin-windows-x64/*.hfpkg
            dist/plugin-windows-x64/*.hfpkg.sha256
